<!DOCTYPE html>
<html lang="en">

<meta name="theme-color" media="(prefers-color-scheme: light)" content="#0f0d24">
<meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#040210">
<head>


  <base href="/web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="soyourhomeworld">
  <link rel="apple-touch-icon" href="web/icons/Icon-192.png">
  <!-- English -->

  <meta charset="UTF-8">
  <meta http-equiv="Content-Language" content="en">
  <!-- Layout -->

  <meta name="screen-orientation" content="portrait">
  <meta name="x5-orientation" content="portrait">
  <meta name="full-screen" content="yes">
  <meta name="x5-fullscreen" content="true">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#2d296a">

  <!-- Experimental -->
  <meta name="apple-mobile-web-app-capable" content="yes">


  <!-- Facebook share -->
  <meta property="og:title" content="Help, my Homeworld is under Attack!">
  <!-- This is a lie. It's actually a book, but I'm worried social media is delisting books. I have never seen a book linked afaik. -->
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://homeworld.help">
  <meta property="og:image" content="https://homeworld.help/images/smoke_hard.jpg">
  <meta property="og:description" content="Something's going on at the EPA. Harvey Silverstein must track down the Climate Czar, while staying out of the Palantir.">

  <title>soyourhomeworld</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
    Scrollbar hide doesn't work on iOS, they add a default one when overflow:true and  -webkit-overflow-scrolling: touch;
    Sadly since iOS 13, this value is forced on iOS -> https://developer.apple.com/documentation/safari-release-notes/safari-13-release-notes
    */
    ::-webkit-scrollbar {
      display: false;
      width: 0px;
      height: 0px;  /* Remove scrollbar space */
      background: transparent;  /* Optional: just make scrollbar invisible */
    }
  </style>

</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
